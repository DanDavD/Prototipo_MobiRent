<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>MobiRent - Alquiler de Mobiliario y Equipamiento</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            forest: {
              DEFAULT: '#1A4314',
              hover: '#13330F',
              light: '#F4F7F3',
              border: '#DCE6DA'
            },
            charcoal: {
              DEFAULT: '#222222',
              muted: '#717171',
              light: '#B0B0B0'
            },
            surface: {
              DEFAULT: '#FFFFFF',
              subtle: '#F7F7F7',
              border: '#EBEBEB'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos Globales -->
  <link rel="stylesheet" href="css/styles.css?v=2.0">

  <!-- Vue 3 CDN (jsDelivr con Fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.js"><\/script>');
    }
  </script>
</head>
<body class="bg-white text-charcoal font-sans antialiased min-h-screen selection:bg-forest selection:text-white">

  <div id="app" class="min-h-screen flex flex-col bg-white">
    
    <!-- Barra Superior de Navegación -->
    <navbar-component></navbar-component>

    <!-- Contenedor Principal Adaptativo -->
    <main class="flex-1 w-full">
      <!-- 1. Vista Arrendatario / Comprador -->
      <renter-view v-if="store.activeRole === 'renter'"></renter-view>

      <!-- 2. Vista Arrendador / Vendedor (Dueño) -->
      <owner-view v-else-if="store.activeRole === 'owner'"></owner-view>

      <!-- 3. Vista Operaciones -->
      <admin-view v-else-if="store.activeRole === 'admin'"></admin-view>
    </main>

    <!-- Capa de Modales (Detalle, Checkout, Seguimiento, Publicación y Mensajes) -->
    <modals-component></modals-component>

  </div>

  <!-- Scripts Modulares (con control de caché) -->
  <script src="js/data.js?v=2.1"></script>
  <script src="js/store.js?v=2.1"></script>
  <script src="js/components/Navbar.js?v=2.1"></script>
  <script src="js/components/RenterView.js?v=2.1"></script>
  <script src="js/components/OwnerView.js?v=2.1"></script>
  <script src="js/components/AdminView.js?v=2.1"></script>
  <script src="js/components/Modals.js?v=2.1"></script>
  <script src="js/app.js?v=2.1"></script>

</body>
</html>
